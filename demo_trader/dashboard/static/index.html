<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TA-35 Paper Trader</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>TA-35 Paper Trader</h1>
    <div class="toolbar">
      <label>Timeframe
        <select id="days">
          <option value="1">1 day</option>
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
          <option value="365">1 year</option>
        </select>
      </label>
      <button id="refresh" type="button">Refresh</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <nav class="tabs">
    <button type="button" class="tab active" data-tab="portfolio">Portfolio &amp; cycles</button>
    <button type="button" class="tab" data-tab="knowledge">Knowledge center</button>
    <button type="button" class="tab" data-tab="supervision">Run supervision</button>
  </nav>

  <main id="tab-portfolio" class="panel active">
    <section class="cards" id="summary-cards"></section>
    <div class="grid-2">
      <section>
        <h2>Holdings vs cash</h2>
        <canvas id="alloc-chart"></canvas>
      </section>
      <section>
        <h2>Positions</h2>
        <table id="positions-table">
          <thead><tr><th>Symbol</th><th>Qty</th><th>Last</th><th>Value ₪</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
    <section>
      <h2>Cycles <span class="muted">(newest first)</span></h2>
      <div id="cycles-list"></div>
    </section>
  </main>

  <main id="tab-knowledge" class="panel">
    <div class="toolbar sub">
      <label><input type="checkbox" id="maya-only" /> Maya flash / reports only</label>
    </div>
    <section id="knowledge-list"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
